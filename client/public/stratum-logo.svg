<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="stratumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5C0" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0C111C" />
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <!-- Layered Stratum Stack Icon -->
  <polygon points="50,22 80,36 50,50 20,36" fill="url(#stratumGrad)" opacity="0.95" />
  <polygon points="50,40 76,52 50,64 24,52" fill="#00E5C0" opacity="0.75" />
  <polygon points="50,56 72,66 50,76 28,66" fill="#6366F1" opacity="0.55" />
</svg>

